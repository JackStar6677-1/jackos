<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="460" height="70">
  <defs>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f2fe"/>
      <stop offset="70%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(35, 35) scale(0.11)">
    <polygon points="0,-180 18,-30 0,0" fill="#ffd700"/>
    <polygon points="0,-180 -18,-30 0,0" fill="#e6ac00"/>
    <polygon points="0,180 18,30 0,0" fill="#e6ac00"/>
    <polygon points="0,180 -18,30 0,0" fill="#ffd700"/>
    <polygon points="180,0 30,-18 0,0" fill="#ffd700"/>
    <polygon points="180,0 30,18 0,0" fill="#e6ac00"/>
    <polygon points="-180,0 -30,-18 0,0" fill="#e6ac00"/>
    <polygon points="-180,0 -30,18 0,0" fill="#ffd700"/>
    <circle cx="0" cy="0" r="22" fill="#00f2fe"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
  </g>

  <!-- Titles -->
  <text x="75" y="36" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="19" letter-spacing="3.5">JACKOS SOVEREIGN</text>
  <text x="75" y="52" fill="url(#goldText)" font-family="monospace" font-weight="bold" font-size="9" letter-spacing="2">ARCHITECT CONSOLE // MAIN NODE</text>

  <!-- Decorative line -->
  <line x1="75" y1="59" x2="380" y2="59" stroke="url(#cyanLine)" stroke-width="1.5"/>
</svg>
