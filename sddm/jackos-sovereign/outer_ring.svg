<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <linearGradient id="nodeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="nodeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0070f3"/>
    </linearGradient>
    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b827fc"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00aa55"/>
    </linearGradient>
    <linearGradient id="nodeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#cc0066"/>
    </linearGradient>
  </defs>
  <g transform="translate(450, 450)">
    <!-- Main outer orbital orbit -->
    <circle r="400" fill="none" stroke="#1f2536" stroke-width="2"/>
    <circle r="400" fill="none" stroke="#7928ca" stroke-width="1.5" stroke-dasharray="140 30 40 30 200 40" opacity="0.6"/>
    <circle r="380" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4 16" opacity="0.4"/>

    <!-- Node NOVA WS -->
    <g transform="translate(0.0, -400.0)">
      <circle r="14" fill="#0b0f19" stroke="url(#nodeCyan)" stroke-width="2"/>
      <circle r="5" fill="url(#nodeCyan)"/>
      <text x="0" y="26" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle" letter-spacing="1">NODE A</text>
      <text x="0" y="36" fill="#8892b0" font-family="monospace" font-size="8" text-anchor="middle">HOST</text>
    </g>

    <!-- Node STAR VPS -->
    <g transform="translate(380.4, -123.6)">
      <circle r="14" fill="#0b0f19" stroke="url(#nodeGold)" stroke-width="2"/>
      <circle r="5" fill="url(#nodeGold)"/>
      <text x="0" y="26" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle" letter-spacing="1">NODE B</text>
      <text x="0" y="36" fill="#8892b0" font-family="monospace" font-size="8" text-anchor="middle">CLOUD</text>
    </g>

    <!-- Node DRAKES -->
    <g transform="translate(235.1, 323.6)">
      <circle r="14" fill="#0b0f19" stroke="url(#nodeRed)" stroke-width="2"/>
      <circle r="5" fill="url(#nodeRed)"/>
      <text x="0" y="26" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle" letter-spacing="1">NODE D</text>
      <text x="0" y="36" fill="#8892b0" font-family="monospace" font-size="8" text-anchor="middle">NODE E</text>
    </g>

    <!-- Node CCG NET -->
    <g transform="translate(-235.1, 323.6)">
      <circle r="14" fill="#0b0f19" stroke="url(#nodeGreen)" stroke-width="2"/>
      <circle r="5" fill="url(#nodeGreen)"/>
      <text x="0" y="26" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle" letter-spacing="1">NODE C</text>
      <text x="0" y="36" fill="#8892b0" font-family="monospace" font-size="8" text-anchor="middle">NODE F</text>
    </g>

    <!-- Node SAORI SRE -->
    <g transform="translate(-380.4, -123.6)">
      <circle r="14" fill="#0b0f19" stroke="url(#nodePurple)" stroke-width="2"/>
      <circle r="5" fill="url(#nodePurple)"/>
      <text x="0" y="26" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle" letter-spacing="1">AI OPS</text>
      <text x="0" y="36" fill="#8892b0" font-family="monospace" font-size="8" text-anchor="middle">AI CORE</text>
    </g>

  </g>
</svg>