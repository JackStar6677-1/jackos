# Backend multimedia de Qt (el de gstreamer no pinta el wallpaper: queda en negro).
# El backend ffmpeg si pinta, pero por defecto decodifica por software y consume
# un nucleo completo (~101% CPU) con un video 2560x1600. Esta variable le pide
# usar VA-API (Iris Xe soporta decodificacion H.264/H.265 por hardware).
QT_MEDIA_BACKEND=ffmpeg
QT_FFMPEG_DECODING_HW_DEVICE_TYPES=vaapi
